plugins {
    id 'com.android.application'
}

android {
    namespace 'app.levelup'
    compileSdk 34

    defaultConfig {
        applicationId 'app.levelup'
        minSdk 24
        targetSdk 34
        // CI passes the run number so every build installs over the previous one
        versionCode((project.findProperty('versionCode') ?: '1') as int)
        versionName "1.0.${versionCode}"
    }

    // A fixed key so each new APK updates the installed app (and keeps its data) instead of
    // clashing with it. This is a sideloaded hobby app; the key is public on purpose.
    signingConfigs {
        release {
            storeFile rootProject.file('levelup.keystore')
            storePassword 'levelup-public'
            keyAlias 'levelup'
            keyPassword 'levelup-public'
        }
    }

    buildTypes {
        release {
            // R8 drops the unused parts of androidx (most of classes.dex) and shrinkResources the resources
            // only they used. What JavaScript and Android reach by name is kept in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    packaging {
        resources {
            // build metadata of the libraries, never read at runtime
            excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module', 'kotlin/**', 'DebugProbesKt.bin']
        }
    }

    // the encrypted dependency list Google Play reads; this APK is sideloaded
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'   // FileProvider for handing updates to the installer
}
