# LEVEL UP Family: the family's own relay + the parent web app. Workers Free plan compatible:
# SQLite-backed Durable Objects (new_sqlite_classes), static assets, no KV / R2 / D1, no secrets needed
# (the Web Push VAPID keys are generated inside each family's Durable Object on first use).
name = "levelup-family"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[[durable_objects.bindings]]
name = "FAMILY"
class_name = "Family"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Family", "Registry"]

[observability]
enabled = false
