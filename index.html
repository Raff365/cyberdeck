<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14123a">
<title>LOCK-IN</title>
<style>
:root {
  --bg: #14123a;
  --card: rgba(20, 20, 70, .72);
  --card-border: rgba(120, 120, 255, .14);
  --text: #f2f3ff;
  --muted: #8d90c4;
  --teal: #4fe3d6;
  --blue: #3b82f6;
  --orange: #ff9a2e;
  --yellow: #f5c518;
  --red: #ff3b30;
  --green: #22c55e;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
body {
  min-height: 100vh;
  background:
    radial-gradient(1.5px 1.5px at 12% 8%, #fff8, transparent),
    radial-gradient(1.5px 1.5px at 78% 14%, #fff6, transparent),
    radial-gradient(1px 1px at 40% 30%, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 90% 48%, #fff5, transparent),
    radial-gradient(1px 1px at 8% 62%, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 55% 78%, #fff5, transparent),
    radial-gradient(1px 1px at 30% 92%, #fff6, transparent),
    linear-gradient(180deg, #191650, #14123a 55%, #0e0d2b);
  background-attachment: fixed;
  padding-bottom: 110px;
}
.app { max-width: 480px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 14px) 14px 0; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.logo { font-family: Impact, "Arial Narrow Bold", sans-serif; font-size: 34px; letter-spacing: -1px; font-weight: 900; transform: scaleY(1.1); }
.logo i { font-style: normal; opacity: .9; font-size: 22px; padding: 0 1px; }
.user { position: relative; background: var(--blue); border-radius: 8px; padding: 6px 12px 6px 8px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; border: 0; color: #fff; cursor: pointer; }
.user .av { width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9bd, #234); }
.user .flame { position: absolute; top: -12px; right: -6px; font-size: 20px; filter: drop-shadow(0 0 4px #f80); }
.user .flame b { position: absolute; left: 0; right: 0; bottom: 1px; text-align: center; font-size: 9px; color: #fff; }

/* grid */
.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px; backdrop-filter: blur(6px); }
.h { font-size: 11px; letter-spacing: 1.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; margin: 18px 4px 8px; display: flex; justify-content: space-between; align-items: center; }
.h button { background: none; border: 0; color: var(--teal); font-weight: 700; font-size: 12px; letter-spacing: 1px; cursor: pointer; }

/* ovr */
.ovr { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; background: none; border: 0; }
.ring { position: relative; width: 100%; max-width: 190px; aspect-ratio: 1; }
.ring svg { width: 100%; height: 100%; }
.ring .emblem { position: absolute; inset: 0; display: grid; place-items: center; }
.ring .emblem svg { width: 56%; height: 56%; }
.ovr-num { font-size: 24px; font-weight: 700; margin-top: 4px; }
.rank { font-size: 15px; font-weight: 600; }

/* body map */
.bodies { display: flex; justify-content: space-around; }
.bodies svg { width: 46%; height: auto; }
.bodies .m { cursor: pointer; stroke: #111; stroke-width: 1.2; transition: fill .2s; }
.chips { display: flex; flex-wrap: wrap; gap: 5px 6px; justify-content: center; margin-top: 8px; }
.chip { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 99px; color: #fff; }
.mhint { text-align: center; color: var(--muted); font-size: 10px; margin-top: 6px; }

/* goals */
.goal { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.goal .t { font-weight: 700; font-size: 17px; }
.goal .d { color: var(--muted); font-size: 13px; margin-top: 2px; }
.pill { background: var(--red); border: 0; color: #fff; font-weight: 700; padding: 8px 14px; border-radius: 99px; font-size: 13px; cursor: pointer; white-space: nowrap; box-shadow: 0 0 14px #ff3b3055; }
.pill.done { background: var(--green); box-shadow: 0 0 14px #22c55e55; }
.bar { height: 3px; background: #ffffff1a; border-radius: 3px; margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--red); transition: width .3s; }
.goalwrap + .goalwrap { margin-top: 10px; }
.rm { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; }

/* habits */
.habit { display: flex; align-items: center; gap: 12px; padding: 13px 12px; background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; margin-bottom: 9px; cursor: pointer; user-select: none; }
.habit .ic { color: var(--orange); font-size: 22px; width: 26px; text-align: center; }
.habit .nm { font-size: 18px; font-weight: 500; }
.habit .meta { display: flex; gap: 10px; align-items: center; margin-top: 3px; font-size: 13px; color: var(--muted); }
.cat { background: #ff9a2e22; color: var(--orange); padding: 1px 8px; border-radius: 6px; font-weight: 600; }
.habit .grow { flex: 1; }
.check { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #3a5a66; display: grid; place-items: center; font-size: 18px; color: var(--green); transition: all .15s; flex: none; }
.habit.on .check { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 0 14px #22c55e66; }
.habit .streak { color: var(--orange); font-weight: 700; }

/* heatmap */
.hm-head { display: flex; justify-content: space-between; align-items: center; color: var(--orange); font-weight: 700; margin-bottom: 8px; gap: 8px; }
.hm-head select { background: #0003; color: var(--orange); border: 1px solid var(--card-border); border-radius: 8px; padding: 4px 6px; font-weight: 700; font-size: 14px; max-width: 70%; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 2px; background: #3a3320; min-width: 0; }
.heat i.on { background: var(--yellow); }
.heat i.fut { background: transparent; }
.hm-foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); }
.hm-foot b { color: var(--text); }

/* hub */
.hub { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.hub b { color: var(--orange); font-size: 16px; }
.timer { text-align: center; font-size: 28px; font-weight: 800; color: var(--orange); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.sub { text-align: center; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.ghost { background: #ffffff12; border: 1px solid var(--card-border); color: var(--text); padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; }

/* fab + modal */
.fab { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom) + 22px); width: 58px; height: 58px; border-radius: 50%; background: #ff2d6f; color: #fff; border: 0; font-size: 34px; line-height: 1; box-shadow: 0 6px 20px #ff2d6f77; cursor: pointer; z-index: 20; }
.sheet-bg { position: fixed; inset: 0; background: #000a; display: none; align-items: flex-end; justify-content: center; z-index: 30; }
.sheet-bg.open { display: flex; }
.sheet { background: #1b1950; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 20px 18px calc(env(safe-area-inset-bottom) + 22px); }
.sheet h3 { margin-bottom: 12px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.tabs button { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--card-border); background: #ffffff0a; color: var(--muted); font-weight: 700; cursor: pointer; }
.tabs button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
.sheet input, .sheet select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border); background: #0004; color: var(--text); font-size: 16px; margin-bottom: 10px; }
.days { display: flex; gap: 6px; margin-bottom: 12px; }
.days button { flex: 1; padding: 9px 0; border-radius: 8px; border: 1px solid var(--card-border); background: #ffffff0a; color: var(--muted); font-weight: 700; cursor: pointer; }
.days button.on { background: var(--orange); color: #111; border-color: var(--orange); }
.save { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--red); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }
.empty { text-align: center; color: var(--muted); padding: 18px; font-size: 14px; }
.toast { position: fixed; left: 50%; top: 18px; transform: translate(-50%, -80px); background: #22c55e; color: #04210f; font-weight: 800; padding: 9px 16px; border-radius: 99px; transition: transform .25s; z-index: 50; }
.toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="logo">LOCK<i>∞</i>IN</div>
    <button class="user" id="user"><span class="av"></span><span id="uname">Blake</span><span class="flame">🔥<b id="uflame">0</b></span></button>
  </div>

  <div class="hero">
    <div class="ovr">
      <div class="ring">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="90" fill="none" stroke="#4a4d5c" stroke-width="8"/>
          <circle id="ringfill" cx="100" cy="100" r="90" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="565.5" stroke-dashoffset="565.5" style="transition: stroke-dashoffset .8s"/>
        </svg>
        <div class="emblem">
          <svg viewBox="0 0 100 100" id="emblem"></svg>
        </div>
      </div>
      <div class="ovr-num">OVR: <span id="ovr">0</span></div>
      <div class="rank" id="rank"></div>
    </div>

    <div class="card">
      <div class="bodies" id="bodies"></div>
      <div class="chips" id="chips"></div>
      <div class="mhint">Tap a muscle to level it up</div>
    </div>
  </div>

  <div class="h"><span>Goals</span></div>
  <div id="goals"></div>

  <div class="h"><span>Habits</span><span id="todaycount"></span></div>
  <div id="habits"></div>

  <div class="h"><span>Consistency</span></div>
  <div class="card">
    <div class="hm-head"><select id="hmsel"></select><span id="hmcount"></span></div>
    <div class="heat" id="heat"></div>
    <div class="hm-foot"><span><b id="hmpct">0%</b> <small id="hmfrac"></small></span><span>last 17 weeks</span></div>
  </div>

  <div class="h"><span>Hub</span></div>
  <div class="card">
    <div class="hub"><b id="quitname">🌽 Quit streak</b><span class="sub" id="quitbest"></span></div>
    <div class="timer" id="timer">0d 0h 0m</div>
    <div class="sub">since quitting</div>
    <div class="row">
      <button class="ghost" id="quitedit">Edit</button>
      <button class="ghost" id="quitreset">I relapsed — reset</button>
    </div>
  </div>
</div>

<button class="fab" id="fab" aria-label="Add">+</button>

<div class="sheet-bg" id="sheetbg">
  <div class="sheet">
    <div class="tabs"><button id="tabH" class="on">Habit</button><button id="tabG">Goal</button></div>
    <div id="formH">
      <input id="hname" placeholder="Habit name (e.g. Drink Water)" maxlength="40">
      <select id="hcat"><option>Health</option><option>Gym</option><option>Mind</option><option>Work</option><option>Social</option></select>
      <div class="days" id="hdays"></div>
    </div>
    <div id="formG" style="display:none">
      <input id="gname" placeholder="Goal (e.g. Get Abs)" maxlength="40">
      <input id="gdate" type="date">
    </div>
    <button class="save" id="save">Save</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'lockin.v1';
const DAYS = ['S','M','T','W','T','F','S'];
const LEVELS = [
  { n: 'Beginner',     c: '#d4a017' },
  { n: 'Intermediate', c: '#f08c1a' },
  { n: 'Experienced',  c: '#3aa655' },
  { n: 'Advanced',     c: '#8b5cf6' },
  { n: 'Elite',        c: '#3b82f6' },
  { n: 'Champion',     c: '#c0262d' },
];
const TIERS = [
  { n: 'Iron', c: '#9aa0a6' }, { n: 'Bronze', c: '#cd7f32' }, { n: 'Silver', c: '#cfd8e3' },
  { n: 'Gold', c: '#f5c518' }, { n: 'Platinum', c: '#4fe3d6' }, { n: 'Diamond', c: '#7cc4ff' },
  { n: 'Champion', c: '#ff4d6d' },
];
const ROMAN = ['I', 'II', 'III'];

const MUSCLES = {
  front: [
    ['Chest', 'e', 78, 62, 14, 11, 0, 1], ['Chest', 'e', 102, 62, 14, 11, 0, 1],
    ['Shoulders', 'e', 60, 52, 9, 9, 0, 1], ['Shoulders', 'e', 120, 52, 9, 9, 0, 1],
    ['Abs', 'r', 80, 78, 20, 40, 5, 0],
    ['Obliques', 'e', 72, 98, 6, 16, 0, 1], ['Obliques', 'e', 108, 98, 6, 16, 0, 1],
    ['Biceps', 'e', 52, 78, 7, 14, 0, 1], ['Biceps', 'e', 128, 78, 7, 14, 0, 1],
    ['Forearms', 'e', 46, 108, 6, 16, 0, 1], ['Forearms', 'e', 134, 108, 6, 16, 0, 1],
    ['Quads', 'e', 77, 164, 13, 32, 0, 1], ['Quads', 'e', 103, 164, 13, 32, 0, 1],
    ['Calves', 'e', 75, 224, 8, 22, 0, 1], ['Calves', 'e', 105, 224, 8, 22, 0, 1],
  ],
  back: [
    ['Traps', 'e', 90, 48, 16, 8, 0, 0],
    ['Shoulders', 'e', 60, 52, 9, 9, 0, 1], ['Shoulders', 'e', 120, 52, 9, 9, 0, 1],
    ['Lats', 'e', 76, 76, 12, 20, 0, 1], ['Lats', 'e', 104, 76, 12, 20, 0, 1],
    ['Lower Back', 'e', 90, 104, 12, 10, 0, 0],
    ['Triceps', 'e', 52, 78, 7, 14, 0, 1], ['Triceps', 'e', 128, 78, 7, 14, 0, 1],
    ['Forearms', 'e', 46, 108, 6, 16, 0, 1], ['Forearms', 'e', 134, 108, 6, 16, 0, 1],
    ['Glutes', 'e', 78, 130, 13, 13, 0, 1], ['Glutes', 'e', 102, 130, 13, 13, 0, 1],
    ['Hamstrings', 'e', 77, 170, 12, 28, 0, 1], ['Hamstrings', 'e', 103, 170, 12, 28, 0, 1],
    ['Calves', 'e', 75, 224, 8, 22, 0, 1], ['Calves', 'e', 105, 224, 8, 22, 0, 1],
  ],
};

/* ---------- state ---------- */
const today = () => ymd(new Date());
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const uid = () => Math.random().toString(36).slice(2, 9);

function seed() {
  return {
    user: 'Blake',
    habits: [
      { id: uid(), name: 'Brush Teeth', cat: 'Health', days: [0, 1, 2, 3, 4, 5, 6], log: {} },
      { id: uid(), name: 'Drink Water', cat: 'Health', days: [0, 1, 2, 3, 4, 5, 6], log: {} },
      { id: uid(), name: 'Gym', cat: 'Gym', days: [0, 1, 2, 3, 4, 5, 6], log: {} },
      { id: uid(), name: 'Sleep 12+ Hours', cat: 'Health', days: [0, 1, 2, 3, 4, 5, 6], log: {} },
    ],
    goals: [{ id: uid(), name: 'Get Abs', date: ymd(addDays(new Date(), 60)), pct: 0 }],
    quit: { name: 'Corn', since: Date.now(), best: 0 },
    muscles: {},
    hm: null,
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
if (!S || !S.habits) S = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = id => document.getElementById(id);

/* ---------- scoring ---------- */
function scheduled(h, d) { return h.days.includes(d.getDay()); }
function completion(days) {
  let due = 0, done = 0;
  for (let i = 0; i < days; i++) {
    const d = addDays(new Date(), -i), k = ymd(d);
    for (const h of S.habits) if (scheduled(h, d)) { due++; if (h.log[k]) done++; }
  }
  return due ? done / due : 0;
}
function streak(h) {
  let n = 0, d = new Date();
  if (!h.log[ymd(d)]) d = addDays(d, -1);
  for (let i = 0; i < 400; i++, d = addDays(d, -1)) {
    if (!scheduled(h, d)) continue;
    if (h.log[ymd(d)]) n++; else break;
  }
  return n;
}
function globalStreak() {
  let n = 0, d = new Date();
  const ok = x => { const due = S.habits.filter(h => scheduled(h, x)); return due.length && due.every(h => h.log[ymd(x)]); };
  if (!ok(d)) d = addDays(d, -1);
  for (let i = 0; i < 400 && ok(d); i++, d = addDays(d, -1)) n++;
  return n;
}
function ovrScore() {
  if (!S.habits.length) return 40;
  const c = completion(14);
  const lv = Object.values(S.muscles);
  const gym = lv.length ? lv.reduce((a, b) => a + b, 0) / (lv.length * 5) : 0;
  return Math.round(40 + c * 50 + Math.min(1, gym) * 9);
}
function rankFor(ovr) {
  const idx = Math.min(TIERS.length * 3 - 1, Math.max(0, Math.floor((ovr - 40) / 60 * TIERS.length * 3)));
  const t = TIERS[Math.floor(idx / 3)];
  return { name: t.n + ' ' + ROMAN[idx % 3], color: t.c, pct: (ovr - 40) / 59 };
}

/* ---------- render ---------- */
function emblem(color) {
  $('emblem').innerHTML =
    `<g fill="none" stroke="${color}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M50 8 L92 50 L50 92 L8 50 Z" opacity=".95"/>
      <path d="M50 24 L76 50 L50 76 L24 50 Z" fill="${color}" fill-opacity=".35"/>
      <path d="M50 38 L62 50 L50 62 L38 50 Z" fill="${color}"/>
    </g>`;
}

function renderOvr() {
  const o = ovrScore(), r = rankFor(o);
  $('ovr').textContent = o;
  $('rank').textContent = r.name; $('rank').style.color = r.color;
  $('ringfill').style.strokeDashoffset = 565.5 * (1 - Math.max(.04, r.pct));
  emblem(r.color);
  $('uname').textContent = S.user;
  $('uflame').textContent = globalStreak();
}

function bodySVG(side) {
  const skin = '#e8e8ee';
  let s = `<svg viewBox="30 0 120 270">
    <circle cx="90" cy="22" r="13" fill="#bbb" stroke="#111" stroke-width="1.2"/>
    <path d="M62 44 Q90 36 118 44 L124 60 L134 110 L142 128 L136 132 L126 118 L118 100 L112 150 L110 250 L96 252 L90 170 L84 252 L70 250 L68 150 L62 100 L54 118 L44 132 L38 128 L46 110 L56 60 Z" fill="${skin}" stroke="#111" stroke-width="1.2" opacity=".35"/>`;
  for (const [name, t, x, y, a, b, rx, scale] of MUSCLES[side]) {
    const lv = S.muscles[name] || 0, c = LEVELS[lv].c;
    s += t === 'e'
      ? `<ellipse class="m" data-m="${name}" cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${c}"/>`
      : `<rect class="m" data-m="${name}" x="${x}" y="${y}" width="${a}" height="${b}" rx="${rx}" fill="${c}"/>`;
  }
  return s + '</svg>';
}
function renderBody() {
  $('bodies').innerHTML = bodySVG('front') + bodySVG('back');
  $('chips').innerHTML = LEVELS.map(l => `<span class="chip" style="background:${l.c}">${l.n}</span>`).join('');
  document.querySelectorAll('.m').forEach(el => el.onclick = () => {
    const m = el.dataset.m;
    S.muscles[m] = ((S.muscles[m] || 0) + 1) % LEVELS.length;
    save(); renderBody(); renderOvr();
    toast(`${m}: ${LEVELS[S.muscles[m]].n}`);
  });
}

function renderGoals() {
  const el = $('goals');
  if (!S.goals.length) { el.innerHTML = '<div class="card empty">No goals yet — tap + to add one.</div>'; return; }
  el.innerHTML = S.goals.map(g => {
    const dt = g.date ? new Date(g.date + 'T00:00:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) : '';
    return `<div class="goalwrap"><div class="card">
      <div class="goal">
        <div><div class="t">${esc(g.name)}</div><div class="d">${dt}</div></div>
        <div style="display:flex;align-items:center;gap:4px">
          <button class="pill ${g.pct >= 100 ? 'done' : ''}" data-g="${g.id}">${g.pct >= 100 ? '✓ Complete' : g.pct + '% Complete'}</button>
          <button class="rm" data-rg="${g.id}" aria-label="Delete goal">×</button>
        </div>
      </div>
      <div class="bar"><i style="width:${g.pct}%;${g.pct >= 100 ? 'background:var(--green)' : ''}"></i></div>
    </div></div>`;
  }).join('');
  el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    const g = S.goals.find(x => x.id === b.dataset.g);
    g.pct = g.pct >= 100 ? 0 : Math.min(100, g.pct + 10);
    save(); renderGoals(); if (g.pct >= 100) toast('Goal complete 🏆');
  });
  el.querySelectorAll('[data-rg]').forEach(b => b.onclick = () => {
    if (confirm('Delete this goal?')) { S.goals = S.goals.filter(x => x.id !== b.dataset.rg); save(); renderGoals(); }
  });
}

function renderHabits() {
  const now = new Date(), k = today();
  const due = S.habits.filter(h => scheduled(h, now));
  $('todaycount').textContent = `${due.filter(h => h.log[k]).length}/${due.length} today`;
  const el = $('habits');
  if (!S.habits.length) { el.innerHTML = '<div class="card empty">No habits yet — tap + to add one.</div>'; return; }
  el.innerHTML = S.habits.map(h => {
    const on = !!h.log[k], sch = h.days.length === 7 ? 'every day' : h.days.map(d => DAYS[d]).join(',');
    const st = streak(h);
    return `<div class="habit ${on ? 'on' : ''}" data-h="${h.id}">
      <div class="ic">⟳</div>
      <div class="grow"><div class="nm">${esc(h.name)}</div>
        <div class="meta"><span class="cat">${esc(h.cat)}</span><span>${sch}</span>${st ? `<span class="streak">🔥 ${st}</span>` : ''}</div></div>
      <div class="check">${on ? '✓' : ''}</div>
      <button class="rm" data-rh="${h.id}" aria-label="Delete habit">×</button>
    </div>`;
  }).join('');
  el.querySelectorAll('.habit').forEach(row => row.onclick = e => {
    if (e.target.dataset.rh) return;
    const h = S.habits.find(x => x.id === row.dataset.h);
    if (h.log[k]) delete h.log[k]; else h.log[k] = true;
    save(); renderAll();
  });
  el.querySelectorAll('[data-rh]').forEach(b => b.onclick = () => {
    if (confirm('Delete this habit?')) { S.habits = S.habits.filter(x => x.id !== b.dataset.rh); save(); renderAll(); }
  });
}

function renderHeat() {
  const sel = $('hmsel');
  if (!S.habits.length) { sel.innerHTML = ''; $('heat').innerHTML = ''; $('hmcount').textContent = ''; $('hmpct').textContent = '0%'; $('hmfrac').textContent = ''; return; }
  if (!S.habits.some(h => h.id === S.hm)) S.hm = (S.habits.find(h => /sleep/i.test(h.name)) || S.habits[0]).id;
  sel.innerHTML = S.habits.map(h => `<option value="${h.id}" ${h.id === S.hm ? 'selected' : ''}>${esc(h.name)}</option>`).join('');
  const h = S.habits.find(x => x.id === S.hm), WEEKS = 17;
  const end = new Date(); end.setDate(end.getDate() + (6 - end.getDay()));       // end of this week (Sat)
  const start = addDays(end, -(WEEKS * 7 - 1));
  let html = '', total = 0, done = 0, due = 0, dueDone = 0;
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = addDays(start, i), k = ymd(d);
    if (d > new Date()) { html += '<i class="fut"></i>'; continue; }
    const on = !!h.log[k]; if (on) total++;
    if (scheduled(h, d)) { due++; if (on) dueDone++; }
    html += `<i class="${on ? 'on' : ''}" title="${k}"></i>`;
  }
  $('heat').style.gridTemplateColumns = `repeat(${WEEKS}, 1fr)`;
  $('heat').innerHTML = html;
  $('hmcount').textContent = total;
  $('hmpct').textContent = (due ? Math.round(dueDone / due * 100) : 0) + '%';
  $('hmfrac').textContent = `(${dueDone}/${due})`;
}
$('hmsel').onchange = e => { S.hm = e.target.value; save(); renderHeat(); };

function renderQuit() {
  const q = S.quit;
  $('quitname').textContent = '🌽 ' + (q.name || 'Quit streak');
  const ms = Date.now() - q.since;
  const mins = Math.floor(ms / 6e4), d = Math.floor(mins / 1440), h = Math.floor(mins % 1440 / 60), m = mins % 60;
  const mo = Math.floor(d / 30), dd = d % 30;
  $('timer').textContent = (mo ? mo + 'mo ' : '') + dd + 'd ' + h + 'h ' + m + 'm';
  $('quitbest').textContent = q.best ? 'best ' + Math.floor(q.best / 864e5) + 'd' : '';
}
$('quitreset').onclick = () => {
  if (!confirm('Reset your streak to zero?')) return;
  S.quit.best = Math.max(S.quit.best || 0, Date.now() - S.quit.since);
  S.quit.since = Date.now(); save(); renderQuit();
};
$('quitedit').onclick = () => {
  const n = prompt('What are you quitting?', S.quit.name); if (n === null) return;
  S.quit.name = n.trim() || S.quit.name;
  const dt = prompt('Quit date (YYYY-MM-DD) — leave blank to keep', ymd(new Date(S.quit.since)));
  if (dt && !isNaN(new Date(dt))) S.quit.since = new Date(dt + 'T00:00:00').getTime();
  save(); renderQuit();
};
$('user').onclick = () => { const n = prompt('Your name', S.user); if (n && n.trim()) { S.user = n.trim().slice(0, 16); save(); renderOvr(); } };

/* ---------- add sheet ---------- */
let tab = 'H', pickDays = [0, 1, 2, 3, 4, 5, 6];
function renderDays() {
  $('hdays').innerHTML = DAYS.map((d, i) => `<button data-d="${i}" class="${pickDays.includes(i) ? 'on' : ''}">${d}</button>`).join('');
  $('hdays').querySelectorAll('button').forEach(b => b.onclick = () => {
    const i = +b.dataset.d;
    pickDays = pickDays.includes(i) ? pickDays.filter(x => x !== i) : [...pickDays, i].sort();
    renderDays();
  });
}
function setTab(t) {
  tab = t; $('tabH').classList.toggle('on', t === 'H'); $('tabG').classList.toggle('on', t === 'G');
  $('formH').style.display = t === 'H' ? '' : 'none'; $('formG').style.display = t === 'G' ? '' : 'none';
}
$('tabH').onclick = () => setTab('H'); $('tabG').onclick = () => setTab('G');
$('fab').onclick = () => { renderDays(); $('sheetbg').classList.add('open'); };
$('sheetbg').onclick = e => { if (e.target === $('sheetbg')) $('sheetbg').classList.remove('open'); };
$('save').onclick = () => {
  if (tab === 'H') {
    const name = $('hname').value.trim(); if (!name || !pickDays.length) return;
    S.habits.push({ id: uid(), name, cat: $('hcat').value, days: pickDays.slice(), log: {} });
    $('hname').value = '';
  } else {
    const name = $('gname').value.trim(); if (!name) return;
    S.goals.push({ id: uid(), name, date: $('gdate').value, pct: 0 });
    $('gname').value = ''; $('gdate').value = '';
  }
  save(); $('sheetbg').classList.remove('open'); renderAll();
};

/* ---------- misc ---------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1400); }
function renderAll() { renderOvr(); renderGoals(); renderHabits(); renderHeat(); renderQuit(); }

renderBody(); renderAll(); save();
setInterval(renderQuit, 30000);
</script>
</body>
</html>
